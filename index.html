<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tyba</title>
  <meta name="description" content="Seu arquivo pessoal: notas, tarefas, imagens, links, livros, músicas e o que mais você quiser guardar.">
  <meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10131a" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/img/pwa/icone.svg" type="image/svg+xml">
  <link rel="icon" href="assets/img/pwa/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/pwa/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tyba">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <div class="topo-interno">
      <button type="button" class="ico-btn btn-menu" id="btn-menu" aria-expanded="false" aria-controls="nav-lateral" aria-label="Abrir navegação">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 5h18M3 12h18M3 19h18"/></svg>
      </button>
      <a class="marca" href="#/inicio" aria-label="Tyba"><span class="logo-tyba" role="img" aria-label="Tyba"></span></a>
      <form class="busca-topo" role="search" id="form-busca">
        <label class="sr-only" for="busca-topo">Buscar na Tyba</label>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M17 17l4 4M3 11a8 8 0 1016 0 8 8 0 00-16 0z"/></svg>
        <input type="search" id="busca-topo" placeholder="Buscar em tudo que guardei" autocomplete="off">
      </form>
      <div id="topo-perfil"></div>
      <div id="topo-musica"></div>
    </div>
  </header>

  <div class="layout" id="layout">
    <nav class="nav-lateral" id="nav-lateral" aria-label="Navegação do sistema"></nav>
    <main id="conteudo" tabindex="-1"></main>
    <aside class="direita" id="direita" aria-label="Resumo"></aside>
  </div>
  <p class="rodape"><span id="rodape-nuvem">Tyba</span> · ícones <a href="https://iconoir.com/" target="_blank" rel="noopener">Iconoir</a></p>

  <dialog id="modal" aria-label="Janela"></dialog>
  <div id="janelas"></div>
  <div id="trabalho" hidden></div>
  <div id="atalho-add"></div>
  <div id="player" hidden></div>
  <div id="menu-selecao" class="menu-selecao" hidden><button type="button" data-act="anot-selecao">Guardar como anotação</button></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="aviso-pwa" class="aviso-pwa" role="status" aria-live="polite" hidden></div>
  <input type="file" id="arquivo-cv" accept=".json,application/json" hidden>
  <input type="file" id="arquivo-backup" accept=".json,application/json" hidden>
  <input type="file" id="arquivo-foto" accept="image/*" hidden>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/icones.js"></script>
  <script src="assets/js/atualizacoes.js"></script>
  <script src="assets/js/pet-frases.js"></script>
  <script src="assets/js/nuvem.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/pwa.js"></script>
</body>
</html>
